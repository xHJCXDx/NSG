# Optional Appsmith overlay. MUST be run together with the main Compose file:
#   docker compose -f docker-compose.yml -f docker-compose.appsmith.yml --profile appsmith up -d
# The nexus-net network is declared in docker-compose.yml; this overlay joins it.
services:
  appsmith:
    image: appsmith/appsmith-ce:v1.41
    container_name: osint-appsmith
    profiles:
      - appsmith
    ports:
      - "${APPSMITH_PORT:-8081}:80"
    volumes:
      - appsmith_stacks:/appsmith-stacks
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - nexus-net

volumes:
  appsmith_stacks:
